<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Travel | Acceso y Registro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">🌐 World Travel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">🏠 Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinos.html">🗺️ Destinos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">🔑 Acceso / Registro</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulario con Pestañas -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow rounded-4 p-4">
                    
                    <!-- Pestañas Bootstrap -->
                    <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold" id="tab-login" data-bs-toggle="pill" data-bs-target="#pills-login" type="button">🔑 Iniciar Sesión</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold" id="tab-registro" data-bs-toggle="pill" data-bs-target="#pills-registro" type="button">📝 Registrarse</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        
                        <!-- TAB 1: INICIAR SESIÓN -->
                        <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                            <h4 class="text-center mb-3 fw-bold">Bienvenido de nuevo</h4>
                            <form id="formLogin">
                                <div class="mb-3">
                                    <label for="correoLogin" class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="correoLogin" placeholder="ejemplo@correo.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="passLogin" class="form-label">Contraseña</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="passLogin" placeholder="Ingrese su contraseña" required>
                                        <button class="btn btn-outline-secondary btn-ver-pass" type="button" data-target="passLogin">Mostrar</button>
                                    </div>
                                </div>
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary btn-lg fw-bold">Ingresar</button>
                                </div>
                            </form>
                            <div id="mensajeLogin" class="mt-3"></div>
                        </div>

                        <!-- TAB 2: REGISTRARSE -->
                        <div class="tab-pane fade" id="pills-registro" role="tabpanel">
                            <h4 class="text-center mb-3 fw-bold">Crea tu cuenta</h4>
                            <form id="formRegistro">
                                <div class="mb-3">
                                    <label for="correoReg" class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="correoReg" placeholder="ejemplo@correo.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="passReg" class="form-label">Crear Contraseña</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="passReg" placeholder="Mínimo 6 caracteres" required minlength="6">
                                        <button class="btn btn-outline-secondary btn-ver-pass" type="button" data-target="passReg">Mostrar</button>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="passConfirmReg" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="passConfirmReg" placeholder="Repita la contraseña" required>
                                </div>
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success btn-lg fw-bold">Registrarse</button>
                                </div>
                            </form>
                            <div id="mensajeRegistro" class="mt-3"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-1">🌎 <strong>World Travel</strong> - La red global de turismo</p>
            <p class="text-muted small mb-0">&copy; 2026 Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
